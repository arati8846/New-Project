<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
</head>
<body>

<div class="login-box">

<h2>Student Details</h2>

<form id="studentForm">

<input type="text" id="username" placeholder="Username" required>

<input type="number" id="physics" placeholder="Physics Marks" required>

<input type="number" id="chemistry" placeholder="Chemistry Marks" required>

<input type="number" id="english" placeholder="English Marks" required>

<input type="number" id="total" placeholder="Total" readonly>

<br>

<button type="submit">Submit</button>
<br>

</form>

</div>

<table id="studentTable" border="1">

<tr>

<th>Username</th>
<th>Physics</th>
<th>Chemistry</th>
<th>English</th>
<th>Total</th>

</tr>

</table>

<h3 id="topper">Topper: None</h3>

<script src="script.js"></script>

</body>
</html>
